<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetAI Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="logo">
        <span class="logo-icon">🤖</span>
        <div>
          <div class="logo-title">LeetAI Agent</div>
          <div class="logo-sub">Local AI Powered</div>
        </div>
      </div>
      <div class="status-badge" id="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <div class="section">
      <label class="label">AI Model</label>
      <select id="model-select" class="select">
        <option value="auto">Auto (Best Available)</option>
        <option value="deepseek-coder:6.7b">DeepSeek Coder 6.7B</option>
        <option value="codellama:7b">CodeLlama 7B</option>
        <option value="qwen2.5-coder:7b">Qwen2.5 Coder 7B</option>
        <option value="phi3:mini">Phi-3 Mini</option>
      </select>
    </div>

    <div class="section">
      <label class="label">Language</label>
      <select id="lang-select" class="select">
        <option value="python3">Python 3</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
      </select>
    </div>

    <div class="section toggles">
      <div class="toggle-row">
        <span>Auto Run Tests</span>
        <label class="switch">
          <input type="checkbox" id="auto-run">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>Auto Submit</span>
        <label class="switch">
          <input type="checkbox" id="auto-submit">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <label class="label">Session Token (Optional)</label>
      <input type="password" id="auth-token" class="input" placeholder="Bearer token from dashboard">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="solve-btn">⚡ Auto Solve</button>
      <a href="http://localhost:3000" target="_blank" class="btn btn-ghost">📊 Dashboard</a>
    </div>

    <div class="models-section" id="models-section">
      <div class="models-title">📦 Installed Models</div>
      <div id="models-list" class="models-list">Loading...</div>
    </div>

    <div class="footer">
      <span>v1.0.0</span>
      <a href="https://ollama.ai" target="_blank">Get Ollama →</a>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
